<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@sjgant80-hub/groundlevel-sdk · live demo</title>
<style>
  :root { --void:#0a0a0f; --cream:#e8e8ea; --dim:#8a8a92; --blue:#2563eb; --ox:#8b1a1a; --line:#1a1a22; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 -apple-system, system-ui, sans-serif; background:var(--void); color:var(--cream); padding:24px; max-width:1100px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--dim); font-size:13px; margin-bottom:24px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width: 760px) { .row { grid-template-columns: 1fr; } }
  .card { background:#11131a; border:1px solid var(--line); border-radius:8px; padding:16px; margin-bottom:16px; }
  .card h2 { font-size:14px; margin:0 0 10px; color:var(--blue); text-transform:uppercase; letter-spacing:1px; }
  input, select, textarea, button { font:inherit; background:#0d0d14; color:var(--cream); border:1px solid var(--line); border-radius:6px; padding:9px 12px; width:100%; margin-bottom:8px; }
  textarea { font-family: ui-monospace, "SF Mono", monospace; font-size:13px; min-height:90px; }
  button { background:var(--blue); border-color:var(--blue); color:#fff; cursor:pointer; font-weight:600; }
  button:hover { background:#1d4ed8; }
  pre { background:#0d0d14; border:1px solid var(--line); border-radius:6px; padding:12px; overflow:auto; font-size:12px; line-height:1.5; max-height:340px; }
  .hit { padding:8px 0; border-bottom:1px solid var(--line); }
  .hit:last-child { border-bottom:0; }
  .cite { font-weight:600; font-size:13px; }
  .prin { font-size:12px; color:var(--dim); margin-top:2px; }
  .meta { display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; }
  .chip { background:#1c1f2b; border-radius:3px; padding:2px 6px; font-size:11px; color:var(--dim); }
  .score { display:inline-block; padding:4px 10px; border-radius:4px; font-size:12px; font-weight:600; margin-right:8px; }
  .score.STRONG { background:#0a4f2a; color:#a3e8b8; }
  .score.MODERATE { background:#5a4f0c; color:#f0d65a; }
  .score.WEAK, .score.INADVISABLE { background:#5a1212; color:#f0a3a3; }
  a { color:var(--blue); }
  .topnav { display:flex; gap:14px; margin-bottom:24px; font-size:13px; color:var(--dim); }
  .topnav a { color:var(--dim); text-decoration:none; }
  .topnav a:hover { color:var(--cream); }
</style>
</head>
<body>

<div class="topnav">
  <a href="https://github.com/sjgant80-hub/groundlevel-sdk">repo</a> ·
  <a href="https://github.com/sjgant80-hub/groundlevel-sdk#install">install</a> ·
  <a href="https://github.com/sjgant80-hub/groundlevel">main app</a> ·
  <a href="https://github.com/sjgant80-hub/groundlevel-sdk/issues/new">issues</a>
</div>

<h1>@sjgant80-hub/groundlevel-sdk · live demo</h1>
<div class="sub">running the SDK in your browser via dynamic ESM import · zero build · zero dependencies · <span id="meta">loading…</span></div>

<div class="row">

  <div>
    <div class="card">
      <h2>1 · case search</h2>
      <input id="q" placeholder="describe your situation in 3-10 words" value="landlord deposit not protected">
      <select id="area">
        <option value="">all areas</option>
      </select>
      <button onclick="doSearch()">search</button>
      <div id="searchOut"></div>
    </div>

    <div class="card">
      <h2>2 · 7-strand weave</h2>
      <input id="weaveQ" placeholder="legal query" value="employer dismissed me without process">
      <select id="pattern">
        <option value="">no pattern</option>
      </select>
      <button onclick="doWeave()">run weave</button>
      <div id="weaveOut"></div>
    </div>
  </div>

  <div>
    <div class="card">
      <h2>3 · document drafter</h2>
      <select id="docType"></select>
      <input id="parties" placeholder="parties" value="Smith v Acme Ltd">
      <input id="court" placeholder="court" value="EMPLOYMENT TRIBUNAL">
      <textarea id="facts" placeholder="facts · one paragraph per line">On 12 May, I was summarily dismissed.
No investigation took place.
A grievance was filed and ignored.</textarea>
      <button onclick="doDraft()">draft document</button>
      <pre id="draftOut" style="display:none"></pre>
    </div>

    <div class="card">
      <h2>4 · compliance audit</h2>
      <select id="ca_size">
        <option value="1">solo (1)</option>
        <option value="2-9">small (2-9)</option>
        <option value="10-49" selected>medium (10-49)</option>
        <option value="50-249">large (50-249)</option>
        <option value="250+">enterprise (250+)</option>
      </select>
      <select id="ca_uses_ai">
        <option value="no">not using AI</option>
        <option value="planning">planning AI</option>
        <option value="yes" selected>using AI in production</option>
      </select>
      <select id="ca_eu_users">
        <option value="no">no EU users</option>
        <option value="maybe">maybe</option>
        <option value="yes" selected>yes EU users</option>
      </select>
      <select id="ca_audit_log">
        <option value="no" selected>no audit logging</option>
        <option value="yes">Art 12 logging in place</option>
      </select>
      <button onclick="doAudit()">audit</button>
      <div id="auditOut"></div>
    </div>
  </div>

</div>

<script type="module">
import {
  CASE_DB, AREAS, PATTERN_KEYS, DOC_TYPES,
  searchCases, runWeave, scoreRisk, draftDocument, auditCompliance, VERSION,
} from '../src/index.js';

document.getElementById('meta').textContent = `v${VERSION} · ${CASE_DB.length} cases · ${PATTERN_KEYS.length} patterns`;

const areaSel = document.getElementById('area');
AREAS.forEach(a => areaSel.insertAdjacentHTML('beforeend', `<option value="${a}">${a}</option>`));

const pattSel = document.getElementById('pattern');
PATTERN_KEYS.forEach(p => pattSel.insertAdjacentHTML('beforeend', `<option value="${p}">${p}</option>`));

const docSel = document.getElementById('docType');
DOC_TYPES.forEach(d => docSel.insertAdjacentHTML('beforeend', `<option value="${d}">${d}</option>`));

const esc = s => String(s).replace(/[&<>"]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[m]));

window.doSearch = () => {
  const hits = searchCases(document.getElementById('q').value, document.getElementById('area').value || undefined);
  const html = hits.length === 0 ? '<div class="hit" style="color:var(--dim)">no hits</div>' :
    hits.map(c => `<div class="hit"><div class="cite">${esc(c.citation)}</div><div class="prin">${esc(c.principle)}</div><div class="meta"><span class="chip">${esc(c.area)}</span><span class="chip">${c.year}</span><span class="chip">score ${c._score}</span></div></div>`).join('');
  document.getElementById('searchOut').innerHTML = html;
};

window.doWeave = async () => {
  const out = document.getElementById('weaveOut');
  out.innerHTML = '<div style="color:var(--dim)">running…</div>';
  const w = await runWeave(document.getElementById('weaveQ').value, document.getElementById('pattern').value || undefined);
  const risk = scoreRisk(w);
  const strands = w.results.map(r => {
    const top = r.cases[0];
    return `<div class="hit"><div class="cite">${r.strand} <span class="prin">w=${r.weight.toFixed(1)}</span></div>${top ? `<div class="prin">${esc(top.citation)} — ${esc(top.principle)}</div>` : '<div class="prin">no strong hit</div>'}</div>`;
  }).join('');
  out.innerHTML = `<div style="margin:6px 0 10px"><span class="score ${risk.label}">${risk.label} ${risk.pct}%</span> ${esc(risk.recommendation)}</div>${strands}<div style="color:var(--dim); margin-top:8px; font-size:12px">contradictions: ${w.contradictions.length}</div>`;
};

window.doDraft = async () => {
  const { draft } = await draftDocument({
    type: document.getElementById('docType').value,
    facts: document.getElementById('facts').value,
    parties: document.getElementById('parties').value,
    court: document.getElementById('court').value,
  });
  const pre = document.getElementById('draftOut');
  pre.style.display = 'block';
  pre.textContent = draft;
};

window.doAudit = () => {
  const vars = {
    ca_size: document.getElementById('ca_size').value,
    ca_uses_ai: document.getElementById('ca_uses_ai').value,
    ca_eu_users: document.getElementById('ca_eu_users').value,
    ca_audit_log: document.getElementById('ca_audit_log').value,
  };
  const { gaps, score } = auditCompliance(vars);
  const html = `<div style="margin:6px 0 10px"><span class="score ${score >= 70 ? 'STRONG' : score >= 40 ? 'MODERATE' : 'WEAK'}">${score}/100</span></div>` +
    (gaps.length === 0 ? '<div class="hit" style="color:var(--dim)">no gaps detected against the configured rules</div>' :
      gaps.map(g => `<div class="hit"><div class="cite">[${g.severity}] ${esc(g.framework)}</div><div class="prin">${esc(g.gap)}</div><div class="prin" style="color:var(--blue); margin-top:4px">→ ${esc(g.remedy)}</div></div>`).join(''));
  document.getElementById('auditOut').innerHTML = html;
};

// auto-run search on load so the demo isn't empty
window.doSearch();
</script>

</body>
</html>
